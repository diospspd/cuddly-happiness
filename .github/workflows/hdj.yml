name: CPU Info Collector (All Regions)

#on:
  workflow_dispatch:

concurrency: 
  group: cpu-collector # Защита от конфликтов git push при параллельном запуске

jobs:
  collect-cpu:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Location, Extract CPU info and Save
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Получаем локацию (Azure Metadata)
          LOCATION=$(curl -s -H Metadata:true --noproxy "*" "http://169.254.169.254/metadata/instance/compute/location?api-version=2017-04-02&format=text")
          
          # Очищаем от возможных спецсимволов переноса строки (на всякий случай)
          LOCATION=$(echo "$LOCATION" | tr -d '\r' | tr -d '\n')
          
          # Защита, если метаданные недоступны
          if [[ -z "$LOCATION" ]]; then
            LOCATION="unknown_region"
          fi
          
          echo "Current location is $LOCATION."
          
          # Задаем имя файла на основе региона
          FILE_NAME="${LOCATION}.txt"
          
          # 2. Собираем данные процессора (Кроссплатформенный вариант x86_64 + ARM)
          
          # Попытка 1: Ищем "model name" (стандарт для x86_64)
          CPU_NAME=$(awk -F':' '/^model name/ {print $2; exit}' /proc/cpuinfo | xargs)
          
          # Попытка 2: Если пусто, пробуем достать через lscpu
          if [[ -z "$CPU_NAME" ]]; then
            CPU_NAME=$(lscpu | grep -i "^model name" | cut -d':' -f2 | xargs)
          fi
          
          # Попытка 3: Специфика ARM серверов (например, Azure Ampere), берем Vendor и Part
          if [[ -z "$CPU_NAME" ]]; then
            IMP=$(awk -F':' '/^CPU implementer/ {print $2; exit}' /proc/cpuinfo | xargs)
            PART=$(awk -F':' '/^CPU part/ {print $2; exit}' /proc/cpuinfo | xargs)
            if [[ -n "$IMP" ]]; then
              CPU_NAME="ARM Implementer $IMP Part $PART"
            fi
          fi
          
          # Попытка 4: Заглушка, если ничего не найдено
          if [[ -z "$CPU_NAME" ]]; then
            CPU_NAME="Unknown_$(uname -m)_CPU"
          fi
          
          # Собираем инструкции: x86_64 использует 'flags', ARM использует 'Features'
          CPU_FLAGS=$(awk -F':' '/^flags/ {print $2; exit}' /proc/cpuinfo | xargs)
          if [[ -z "$CPU_FLAGS" ]]; then
            CPU_FLAGS=$(awk -F':' '/^Features/ {print $2; exit}' /proc/cpuinfo | xargs)
          fi
          
          # Защита от пустых флагов
          if [[ -z "$CPU_FLAGS" ]]; then
            CPU_FLAGS="No_Flags_Detected"
          fi
          
          # Формируем строку
          NEW_ENTRY="$CPU_NAME $CPU_FLAGS"
          
          # Создаем файл для этого региона, если его еще нет
          touch "$FILE_NAME"
          
          # 3. Проверяем на уникальность связки "Процессор + Инструкции" именно в ЭТОМ файле
          if ! grep -Fxq "$NEW_ENTRY" "$FILE_NAME"; then
            echo "Found new CPU or new instructions set for region $LOCATION!"
            echo "$NEW_ENTRY" >> "$FILE_NAME"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git add "$FILE_NAME"
            git commit -m "Add new CPU to $LOCATION: $CPU_NAME"
            git pull --rebase
            git push
          else
            echo "This CPU combination already exists in $FILE_NAME. Skipping commit."
          fi

          # 4. Перезапускаем экшен для продолжения "фарминга"
          echo "Restarting workflow to catch more CPUs in random regions..."
          gh workflow run "${{ github.workflow }}"
